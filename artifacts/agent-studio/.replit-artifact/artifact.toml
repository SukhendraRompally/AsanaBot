kind = "web"
previewPath = "/"
title = "Agent Studio Console"
version = "1.0.0"
id = "artifacts/agent-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21494

[services.development]
run = "pnpm --filter @workspace/agent-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agent-studio", "run", "build" ]
publicDir = "artifacts/agent-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21494"
BASE_PATH = "/"
